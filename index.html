<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>검색 결과 통합</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body {
      background-color: #f8f9fa;
      margin: 0;
      padding-top: 60px;
    }
    .search-box {
      max-width: 500px;
      margin: 0 auto 40px auto;
      position: relative;
    }
    .autocomplete-list {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      background-color: white;
      border: 1px solid #ccc;
      z-index: 10;
      max-height: 200px;
      overflow-y: auto;
      border-radius: 0 0 10px 10px;
    }
    .autocomplete-item {
      padding: 8px 12px;
      cursor: pointer;
    }
    .autocomplete-item:hover {
      background-color: #f1f1f1;
    }
    .result-box {
      max-width: 1200px;
      margin: 0 auto;
    }
    .section-title {
      font-size: 1.25rem;
      font-weight: bold;
      margin: 40px 0 20px;
      background-color: #e9ecef;
      padding: 10px 15px;
      border-radius: 10px;
    }
    .result-card {
      background-color: white;
      border: 1px solid #dee2e6;
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
    }
    .hashtag {
      font-size: 0.85rem;
      color: #6c757d;
    }
    mark {
      background-color: yellow;
      padding: 0 2px;
    }
    .npc-highlight {
      font-weight: bold;
      color: #0d6efd;
    }
  </style>
</head>
<body>

<div class="search-box">
  <form id="searchForm">
    <div class="input-group">
      <input id="searchInput" type="text" class="form-control" placeholder="검색어를 입력하세요" autocomplete="off" />
      <button class="btn btn-primary" type="submit">검색</button>
    </div>
  </form>
  <ul id="autocompleteList" class="autocomplete-list"></ul>
</div>

<div class="result-box">
  <div class="row">
    <div class="col-md-6" id="leftResults">
      <div class="section-title">🧠 "검색결과"가 너무 많나요?</div>
    </div>
    <div class="col-md-6" id="rightResults">
      <div class="section-title">🙋 "검색결과"가 필요하신가요?</div>
    </div>
  </div>
</div>

<script src="script.js"></script>
<script async src="https://scripts.simpleanalyticscdn.com/latest.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
